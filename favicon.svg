<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1120"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- health pulse line -->
  <path d="M10 40 h9 l4 -12 5 20 5 -26 4 18 h8"
        fill="none" stroke="url(#g)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- TM monogram -->
  <text x="32" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="15" font-weight="800" fill="#f4f8fd" letter-spacing="1">TM</text>
</svg>
